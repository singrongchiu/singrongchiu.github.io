<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Farm Flick Framework</title>
  <style>
    :root {
      --bg1: #f6ecd2;
      --bg2: #d7efc1;
      --bg-warn-alpha: 0;
      --bg-warn-alpha-soft: 0;
      --ink: #1c2a23;
      --accent: #2f8f46;
      --card: #fff7e6;
      --card-line: #6f7f56;
      --danger: #e95f5f;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(
          circle at 82% 14%,
          rgba(255, 66, 66, var(--bg-warn-alpha)) 0%,
          rgba(255, 66, 66, 0) 54%
        ),
        radial-gradient(
          circle at 16% 84%,
          rgba(255, 128, 128, var(--bg-warn-alpha-soft)) 0%,
          rgba(255, 128, 128, 0) 48%
        ),
        radial-gradient(circle at 20% 0%, #fff8df 0%, var(--bg1) 40%, var(--bg2) 100%);
    }
    .app {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 12px 12px 16px;
      gap: 8px;
    }
    .hud {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .pill {
      border: 2px solid var(--card-line);
      background: #fffef5;
      border-radius: 14px;
      padding: 10px 12px;
      text-align: center;
      font-weight: 700;
      font-size: 18px;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.12);
    }
    .status {
      text-align: center;
      font-size: 14px;
      min-height: 18px;
      font-weight: 700;
    }
    .card-wrap {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 0;
    }
    .card {
      width: min(92vw, 500px);
      height: min(68vh, 540px);
      min-height: 360px;
      border: 3px solid var(--card-line);
      background: linear-gradient(#fffaf0, var(--card));
      border-radius: 20px;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.14);
      padding: 16px 14px 14px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      user-select: none;
    }
    .card.enter {
      animation: cardIn .2s ease-out;
    }
    @keyframes cardIn {
      from { transform: translateY(12px); opacity: .7; }
      to { transform: translateY(0); opacity: 1; }
    }
    .card-head {
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .2px;
    }
    .card-body {
      border: 2px dashed #93a477;
      border-radius: 14px;
      background: #fdf8e7;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 14px;
    }
    .placeholder-icon {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 6px;
      animation: bob 1s ease-in-out infinite alternate;
    }
    @keyframes bob {
      from { transform: translateY(0); }
      to { transform: translateY(-7px); }
    }
    .hint {
      font-size: 15px;
      line-height: 1.3;
      font-weight: 700;
      max-width: 22ch;
    }
    .chip {
      margin-top: 8px;
      font-size: 12px;
      padding: 5px 8px;
      border-radius: 999px;
      border: 1px solid #64824f;
      background: #ecf6dd;
      display: inline-block;
    }
    .burger-game {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto auto;
      align-items: end;
      justify-items: center;
      gap: 10px;
      cursor: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2742%27 height=%2742%27 viewBox=%270 0 28 28%27%3E%3Crect x=%272%27 y=%279%27 width=%2710%27 height=%277%27 rx=%271.5%27 fill=%27%23e6edf3%27 stroke=%27%234d5964%27 stroke-width=%271.5%27/%3E%3Cpath d=%27M12 12h13%27 stroke=%27%237b4e28%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3Cpath d=%27M5 10v5M8 10v5%27 stroke=%27%234d5964%27 stroke-width=%271%27/%3E%3C/svg%3E") 6 20, pointer;
    }
    .grill-scene {
      width: min(304px, 95%);
      height: 100%;
      max-height: 220px;
      border: 3px solid #5a5d63;
      border-radius: 16px;
      background: linear-gradient(#7f838a, #61666d);
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      justify-items: center;
      padding: 10px 8px;
      gap: 8px;
      overflow: hidden;
      cursor: inherit;
    }
    .grill-surface {
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.28) 0 5px,
          rgba(255, 255, 255, 0.06) 5px 12px
      );
      pointer-events: none;
    }
    .burger-smoke-layer {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      overflow: hidden;
    }
    .burger-smoke {
      position: absolute;
      width: 14px;
      height: 14px;
      margin-left: -7px;
      margin-top: -7px;
      border-radius: 50%;
      background: rgba(241, 241, 241, 0.78);
      box-shadow:
        0 0 0 2px rgba(214, 214, 214, 0.3) inset,
        0 0 8px rgba(214, 214, 214, 0.3);
      animation: grillSmoke .72s ease-out forwards;
    }
    @keyframes grillSmoke {
      from { opacity: .78; transform: translate(0, 0) scale(var(--ss)); }
      to { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(calc(var(--ss) + .55)); }
    }
    .patty-slot {
      position: relative;
      width: min(84px, 100%);
      aspect-ratio: 1 / 1;
      border: 0;
      background: none;
      border-radius: 50%;
      padding: 0;
      touch-action: none;
      z-index: 2;
      cursor: inherit;
    }
    .patty-face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid #493126;
      background: radial-gradient(circle at 35% 28%, #cf8a72 0 30%, #af6148 58%, #813f31 100%);
      box-shadow: inset -6px -8px 0 rgba(0, 0, 0, 0.22);
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }
    .patty-mark {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 46%;
      height: 46%;
      margin-left: -23%;
      margin-top: -23%;
      border-radius: 50%;
      border: 3px solid rgba(76, 42, 31, 0.65);
      transform: scale(.85);
      transition: border-color .16s ease;
    }
    .patty-slot.is-flipped .patty-face {
      border-color: #3a281f;
      background: radial-gradient(circle at 35% 26%, #8a5941 0 28%, #694130 58%, #4e3024 100%);
      transform: rotateY(180deg);
    }
    .patty-slot.is-flipped .patty-mark {
      border-color: rgba(36, 18, 12, 0.62);
    }
    .burger-chip {
      margin-top: 0;
    }
    .bulb-game {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto auto;
      align-items: end;
      justify-items: center;
      gap: 8px;
    }
    .lamp-scene {
      --lamp-glow: 0;
      --lamp-glow-size: .88;
      position: relative;
      width: min(280px, 92%);
      height: 220px;
    }
    .lamp-glow {
      position: absolute;
      left: 50%;
      top: 40%;
      width: 176px;
      height: 176px;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(var(--lamp-glow-size));
      background: radial-gradient(
        circle,
        rgba(255, 255, 212, 1) 0%,
        rgba(255, 246, 168, 0.92) 40%,
        rgba(255, 233, 114, 0.46) 66%,
        rgba(255, 237, 132, 0) 100%
      );
      opacity: calc(0.02 + var(--lamp-glow) * 0.98);
      box-shadow:
        0 0 calc(10px + var(--lamp-glow) * 42px) rgba(255, 238, 120, 0.88),
        0 0 calc(18px + var(--lamp-glow) * 58px) rgba(255, 213, 88, 0.5);
      transition: opacity .14s linear, transform .14s ease-out, box-shadow .14s linear;
      pointer-events: none;
    }
    .lamp-stem {
      position: absolute;
      left: 50%;
      top: 24px;
      width: 16px;
      height: 84px;
      margin-left: -8px;
      background: linear-gradient(#557a50, #385739);
      border-radius: 9px;
      border: 2px solid #2f4d30;
    }
    .lamp-socket {
      position: absolute;
      left: 50%;
      top: 102px;
      width: 140px;
      height: 78px;
      margin-left: -70px;
      border-radius: 44px 44px 18px 18px;
      border: 3px solid #486744;
      background: linear-gradient(#a5c98f, #7ba56b);
      box-shadow: inset 0 -8px 0 rgba(0, 0, 0, 0.1);
    }
    .bulb-hit {
      position: absolute;
      left: 50%;
      top: 68px;
      width: 94px;
      height: 132px;
      margin-left: -47px;
      border: 0;
      padding: 0;
      background: none;
      touch-action: none;
      cursor: pointer;
    }
    .bulb-glass {
      position: absolute;
      left: 50%;
      top: 0;
      width: 84px;
      height: 98px;
      margin-left: -42px;
      border-radius: 52% 52% 46% 46%;
      border: 3px solid #607d45;
      background: linear-gradient(#fffbe2, #f4f0d2);
      box-shadow: inset -10px -12px 0 rgba(255, 222, 101, 0.25);
    }
    .bulb-base {
      position: absolute;
      left: 50%;
      top: 88px;
      width: 40px;
      height: 40px;
      margin-left: -20px;
      border-radius: 8px;
      border: 3px solid #536b47;
      background: repeating-linear-gradient(
        to bottom,
        #ddded2 0 5px,
        #bec0b6 5px 10px
      );
    }
    .bulb-swipe-hint {
      font-size: 22px;
      font-weight: 900;
      color: #2a6139;
      letter-spacing: 2px;
      animation: bulbHint 1s ease-in-out infinite;
      user-select: none;
    }
    @keyframes bulbHint {
      0%, 100% { transform: translateX(-12px); opacity: .55; }
      50% { transform: translateX(12px); opacity: 1; }
    }
    .bulb-chip {
      margin-top: 0;
    }
    .plant-game {
      width: 100%;
      height: 100%;
      position: relative;
      display: grid;
      grid-template-rows: 1fr auto auto;
      gap: 10px;
      align-items: end;
      justify-items: center;
    }
    .garden-bed {
      width: min(300px, 95%);
      height: 100%;
      max-height: 220px;
      position: relative;
      z-index: 1;
      border: 3px solid #6a8655;
      border-radius: 16px;
      background:
        linear-gradient(to top, #9a6f42 0 30%, #d7bf95 30% 42%, #b7d79b 42% 100%);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: end;
      gap: 6px;
      padding: 10px 8px 8px;
    }
    .plant-slot {
      position: relative;
      border: 0;
      background: none;
      height: 100%;
      min-height: 140px;
      padding: 0;
      touch-action: none;
    }
    .plant-pot {
      position: absolute;
      left: 50%;
      bottom: 6px;
      width: 52px;
      height: 38px;
      margin-left: -26px;
      border-radius: 8px 8px 14px 14px;
      border: 3px solid #644427;
      background: linear-gradient(#d08f4f, #a86435);
      box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.15);
    }
    .plant-stem {
      position: absolute;
      left: 50%;
      bottom: 42px;
      width: 8px;
      height: 46px;
      margin-left: -4px;
      border-radius: 999px;
      background: #4f7a34;
      transition: transform .15s ease, background .15s ease;
    }
    .plant-leaf {
      position: absolute;
      bottom: 72px;
      width: 30px;
      height: 16px;
      border: 3px solid #44692f;
      background: #78b64d;
      border-radius: 20px 20px 20px 4px;
      transform-origin: center;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }
    .leaf-a {
      left: 50%;
      margin-left: -30px;
      transform: rotate(-24deg);
    }
    .leaf-b {
      left: 50%;
      margin-left: 0;
      transform: scaleX(-1) rotate(-24deg);
    }
    .plant-state {
      position: absolute;
      left: 50%;
      top: 8px;
      margin-left: -14px;
      width: 28px;
      height: 22px;
      border-radius: 999px;
      border: 2px solid #587348;
      background: #edf5d8;
      font-size: 10px;
      font-weight: 900;
      display: grid;
      place-items: center;
      color: #2a4b2f;
      letter-spacing: .2px;
    }
    .plant-slot.is-dry .plant-stem {
      background: #647a4f;
      transform: skewX(-5deg);
    }
    .plant-slot.is-dry .plant-leaf {
      background: #99ad7f;
      border-color: #6d8059;
      transform: rotate(-38deg) scale(.96);
    }
    .plant-slot.is-dry .leaf-b {
      transform: scaleX(-1) rotate(-38deg) scale(.96);
    }
    .plant-slot.is-dry .plant-state {
      background: #f8e8d0;
      border-color: #8e6b3a;
      color: #8b4a2f;
    }
    .can-lane {
      width: min(300px, 95%);
      height: 92px;
      border-radius: 14px;
      border: 2px dashed #8aa270;
      background: #eff8de;
      position: relative;
      z-index: 2;
      overflow: visible;
    }
    .watering-can {
      position: absolute;
      left: 12px;
      top: 24px;
      z-index: 3;
      width: 96px;
      height: 58px;
      border: 0;
      background: none;
      padding: 0;
      touch-action: none;
      cursor: grab;
    }
    .watering-can:active {
      cursor: grabbing;
    }
    .can-body {
      position: absolute;
      left: 8px;
      top: 14px;
      width: 52px;
      height: 34px;
      border-radius: 8px;
      border: 3px solid #335f84;
      background: linear-gradient(#8fd1ff, #5ba8df);
    }
    .can-top {
      position: absolute;
      left: 16px;
      top: 8px;
      width: 34px;
      height: 10px;
      border-radius: 999px;
      border: 3px solid #335f84;
      background: #c6ecff;
    }
    .can-spout {
      position: absolute;
      right: 9px;
      top: 19px;
      width: 34px;
      height: 12px;
      border-radius: 0 999px 999px 0;
      border: 3px solid #335f84;
      border-left-width: 0;
      background: #74b9ea;
    }
    .can-handle {
      position: absolute;
      left: 2px;
      top: 12px;
      width: 20px;
      height: 30px;
      border-radius: 999px 0 0 999px;
      border: 3px solid #335f84;
      border-right-width: 0;
      background: none;
    }
    .plant-chip {
      margin-top: 0;
    }
    .pipe-game {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto auto;
      align-items: end;
      justify-items: center;
      gap: 10px;
    }
    .pipe-stage {
      width: min(290px, 95%);
      height: 100%;
      max-height: 238px;
      position: relative;
      border: 3px solid #5e7d65;
      border-radius: 16px;
      background: linear-gradient(#eaf7ff, #cae6f9);
      padding: 12px;
      box-shadow: inset 0 -7px 0 rgba(0, 0, 0, 0.08);
    }
    .pipe-board {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .pipe-source,
    .pipe-drain {
      position: absolute;
      font-size: 26px;
      line-height: 1;
      pointer-events: none;
      filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.2));
    }
    .pipe-source {
      left: -12px;
      top: 14px;
    }
    .pipe-drain {
      right: -12px;
      bottom: 14px;
    }
    .pipe-tile {
      position: relative;
      border: 2px solid #698264;
      border-radius: 10px;
      background: #f4fbe8;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.08);
      padding: 0;
      overflow: hidden;
      touch-action: manipulation;
    }
    .pipe-tile:active {
      transform: scale(0.98);
    }
    .pipe-tile.is-flow {
      border-color: #3e7da4;
      background: #d9f1ff;
    }
    .pipe-bend {
      --pipe-thickness: 10px;
      --pipe-color: #4f6f78;
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
      transform: rotate(var(--pipe-rot, 0deg));
      transition: transform .16s ease-out, filter .16s ease-out;
    }
    .pipe-bend::before,
    .pipe-bend::after {
      content: "";
      position: absolute;
      background: var(--pipe-color);
      transition: background-color .16s ease-out;
    }
    .pipe-bend::before {
      left: calc(50% - (var(--pipe-thickness) / 2));
      top: 0;
      width: var(--pipe-thickness);
      height: 50%;
      border-radius: 999px 999px 0 0;
    }
    .pipe-bend::after {
      left: 0;
      top: calc(50% - (var(--pipe-thickness) / 2));
      width: 50%;
      height: var(--pipe-thickness);
      border-radius: 999px 0 0 999px;
    }
    .pipe-tile.is-flow .pipe-bend {
      --pipe-color: #2e9fdd;
      filter: drop-shadow(0 0 4px rgba(46, 159, 221, 0.65));
    }
    .pipe-chip {
      margin-top: 0;
    }
    .vanish-game {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto auto;
      align-items: end;
      justify-items: center;
      gap: 10px;
    }
    .vanish-scene {
      width: min(300px, 95%);
      height: 100%;
      max-height: 238px;
      border: 3px solid #5e6180;
      border-radius: 16px;
      background:
        radial-gradient(circle at 30% 20%, #2f3955 0%, #1d2236 45%, #101423 100%);
      box-shadow: inset 0 -8px 0 rgba(0, 0, 0, 0.3);
      padding: 12px;
      display: grid;
      place-items: center;
    }
    .vanish-grid {
      width: min(236px, 100%);
      height: min(236px, 100%);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 7px;
    }
    .vanish-tile {
      position: relative;
      border: 2px solid #5a5f75;
      border-radius: 10px;
      background: linear-gradient(#868ca5, #62687f);
      box-shadow:
        inset 0 -3px 0 rgba(0, 0, 0, 0.22),
        0 0 0 1px rgba(255, 255, 255, 0.06);
      padding: 0;
      touch-action: manipulation;
      transition: background .16s ease, border-color .16s ease, box-shadow .16s ease, transform .1s ease;
    }
    .vanish-tile:active {
      transform: scale(0.97);
    }
    .vanish-tile.is-safe-preview,
    .vanish-tile.is-revealed {
      border-color: #4eaf6d;
      background: linear-gradient(#80d993, #54a967);
      box-shadow:
        inset 0 -3px 0 rgba(0, 0, 0, 0.18),
        0 0 10px rgba(111, 230, 149, 0.35);
    }
    .vanish-tile.is-pit-flash {
      border-color: #c24f4f;
      background: linear-gradient(#ee8484, #cc5f5f);
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.22);
    }
    .vanish-tile.is-avatar::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 52%;
      height: 52%;
      border-radius: 50%;
      border: 2px solid #2f5635;
      background: radial-gradient(circle at 38% 36%, #fdf2cf 0 25%, #d2bc83 65%, #9f8657 100%);
      transform: translate(-50%, -50%);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
    }
    .vanish-marker {
      position: absolute;
      right: 6px;
      top: 4px;
      font-size: 11px;
      line-height: 1;
      font-weight: 900;
      color: #f2f5ff;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
    .vanish-tile.is-start .vanish-marker {
      color: #fff6d2;
    }
    .vanish-tile.is-goal .vanish-marker {
      color: #ffe07e;
      font-size: 12px;
    }
    .vanish-chip {
      margin-top: 0;
    }
    .cooking-game {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 8px;
      align-content: start;
    }
    .cooking-game-icons {
      align-items: stretch;
    }
    .cooking-scene {
      border: 2px solid #8f6c45;
      border-radius: 12px;
      background:
        radial-gradient(circle at 20% 0%, rgba(255, 242, 210, 0.9) 0%, rgba(255, 242, 210, 0) 44%),
        linear-gradient(#c89662, #b17d4c);
      box-shadow: inset 0 -6px 0 rgba(85, 45, 15, 0.25);
      padding: 10px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      align-content: start;
      touch-action: none;
      user-select: none;
    }
    .cooking-counter {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .cooking-bowl-wrap {
      display: grid;
      justify-items: center;
      gap: 8px;
      width: 100%;
    }
    .cooking-item {
      border: 2px solid #8f6c45;
      border-radius: 10px;
      background: #ffe3ba;
      padding: 8px 0;
      display: grid;
      place-items: center;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.12);
      touch-action: none;
      min-height: 58px;
      cursor: grab;
    }
    .cooking-item:active {
      transform: scale(0.98);
      cursor: grabbing;
    }
    .cooking-item.is-selected {
      border-color: #2f7f46;
      background: #d9f5cd;
      box-shadow: 0 0 0 2px rgba(47, 127, 70, 0.18);
    }
    .cooking-item-icon {
      font-size: 30px;
      line-height: 1;
    }
    .cooking-bowl {
      width: min(92%, 240px);
      min-height: 132px;
      border: 3px solid #7a4c28;
      border-radius: 16px;
      background: linear-gradient(#fff4df, #f7d9af);
      box-shadow: inset 0 -4px 0 rgba(75, 35, 11, 0.22);
      display: grid;
      place-items: center;
      position: relative;
      touch-action: manipulation;
      transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
    }
    .cooking-bowl:active {
      transform: scale(0.99);
    }
    .cooking-bowl-main {
      font-size: 56px;
      line-height: 1;
    }
    .cooking-bowl-fill {
      position: absolute;
      bottom: 16px;
      font-size: 28px;
      line-height: 1;
      display: flex;
      gap: 2px;
      align-items: center;
      justify-content: center;
      max-width: 92%;
      flex-wrap: wrap;
      pointer-events: none;
    }
    .cooking-fill-dot {
      font-size: 20px;
      line-height: 1;
      filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.18));
    }
    .cooking-bowl.is-stage-1 {
      transform: scale(1.05);
    }
    .cooking-bowl.is-stage-2 {
      transform: scale(1.12);
    }
    .cooking-bowl.is-drop-target {
      border-color: #3a8b4f;
      box-shadow:
        inset 0 -4px 0 rgba(75, 35, 11, 0.2),
        0 0 0 3px rgba(58, 139, 79, 0.24);
    }
    .cooking-bowl-slots {
      display: grid;
      grid-template-columns: repeat(2, auto);
      gap: 10px;
    }
    .cooking-slot {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid #8f6c45;
      background: #fff3de;
      display: grid;
      place-items: center;
      font-size: 20px;
      opacity: 0.55;
    }
    .cooking-slot.is-added {
      opacity: 1;
      border-color: #3d8751;
      box-shadow: 0 0 0 2px rgba(61, 135, 81, 0.2);
    }
    .cooking-item.is-shaking {
      animation: cookingShake .22s linear;
    }
    .cooking-drag-ghost {
      position: absolute;
      left: 0px;
      top: 0px;
      transform: translate3d(0, 0, 0) translate(-50%, -50%);
      font-size: 34px;
      line-height: 1;
      pointer-events: none;
      z-index: 8;
      filter: drop-shadow(0 2px 1px rgba(0, 0, 0, 0.35));
      will-change: transform;
    }
    @keyframes cookingShake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      50% { transform: translateX(3px); }
      75% { transform: translateX(-2px); }
      100% { transform: translateX(0); }
    }
    .cooking-continue {
      justify-self: center;
      font-size: 0;
      width: 54px;
      height: 46px;
      padding: 0;
      border-radius: 14px;
    }
    .cooking-continue::before {
      content: "▶";
      font-size: 22px;
      line-height: 1;
    }
    .dino-game {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto auto;
      align-items: end;
      justify-items: center;
      gap: 10px;
    }
    .dino-scene {
      width: min(300px, 95%);
      height: 100%;
      max-height: 238px;
      position: relative;
      border: 3px solid #6a8655;
      border-radius: 16px;
      background:
        radial-gradient(circle at 84% 14%, rgba(255, 255, 255, 0.52) 0%, rgba(255, 255, 255, 0) 38%),
        linear-gradient(to top, #9a6f42 0 31%, #d7bf95 31% 43%, #b7d79b 43% 100%);
      box-shadow: inset 0 -7px 0 rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .dino-fence {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 4px;
      height: 28px;
      background:
        repeating-linear-gradient(
          to right,
          #c19162 0 14px,
          #b57f53 14px 18px
        );
      border-top: 3px solid #875a37;
      box-shadow: inset 0 6px 0 rgba(255, 255, 255, 0.14);
      pointer-events: none;
    }
    .dino-flower {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffd7ea;
      border: 2px solid #bc6d92;
      box-shadow:
        -8px 6px 0 -2px #ffd7ea,
        8px 6px 0 -2px #ffd7ea,
        0 11px 0 -6px #ffef97;
      opacity: 0.88;
      pointer-events: none;
    }
    .dino-flower.f1 {
      left: 24px;
      bottom: 72px;
      transform: scale(0.9);
    }
    .dino-flower.f2 {
      right: 28px;
      bottom: 80px;
      transform: scale(0.8);
    }
    .dinosaur {
      position: absolute;
      left: 50%;
      bottom: 66px;
      width: 132px;
      height: 106px;
      margin-left: -66px;
      border: 0;
      background: none;
      padding: 0;
      touch-action: manipulation;
      transform: translateX(var(--dino-shift, 0px)) scale(var(--dino-scale, 1));
      transition: transform .24s ease-out;
    }
    .dino-body {
      position: absolute;
      left: 14px;
      top: 28px;
      width: 80px;
      height: 54px;
      border-radius: 30px 28px 24px 24px;
      border: 3px solid #44692f;
      background: linear-gradient(#93cc63, #6ba649);
      box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.14);
    }
    .dino-tail {
      position: absolute;
      left: 2px;
      top: 43px;
      width: 36px;
      height: 14px;
      border-radius: 999px 4px 4px 999px;
      border: 3px solid #44692f;
      border-right-width: 0;
      background: #6ba44a;
      transform-origin: right center;
      animation: dinoTail .9s ease-in-out infinite alternate;
    }
    @keyframes dinoTail {
      from { transform: rotate(-9deg); }
      to { transform: rotate(8deg); }
    }
    .dino-head {
      position: absolute;
      right: 14px;
      top: 10px;
      width: 46px;
      height: 38px;
      border-radius: 18px;
      border: 3px solid #44692f;
      background: linear-gradient(#9ed76d, #75b14f);
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.14);
      transition: transform .14s ease-out;
    }
    .dinosaur.is-tapped .dino-head {
      transform: translateY(-5px) rotate(-7deg);
    }
    .dino-eye {
      position: absolute;
      right: 10px;
      top: 10px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 2px solid #2e4324;
      background: #1f2d17;
    }
    .dino-cheek {
      position: absolute;
      right: 9px;
      bottom: 8px;
      width: 9px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 184, 184, 0.78);
    }
    .dino-leg {
      position: absolute;
      bottom: 4px;
      width: 18px;
      height: 26px;
      border-radius: 10px 10px 7px 7px;
      border: 3px solid #44692f;
      background: #669f47;
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.15);
    }
    .dino-leg.l1 {
      left: 28px;
    }
    .dino-leg.l2 {
      left: 62px;
    }
    .dino-pop {
      position: absolute;
      left: var(--spark-x, 50%);
      top: var(--spark-y, 48%);
      transform: translate(-50%, -50%);
      font-size: 19px;
      line-height: 1;
      pointer-events: none;
      animation: dinoPop .56s ease-out forwards;
    }
    @keyframes dinoPop {
      from { opacity: .95; transform: translate(-50%, -46%) scale(.75); }
      to { opacity: 0; transform: translate(-50%, -98%) scale(1.12); }
    }
    .dino-chip {
      margin-top: 0;
    }
    .is-hidden {
      display: none;
    }
    .btn {
      border: 2px solid #2f5f39;
      background: linear-gradient(#60b86c, #3b944d);
      color: #fff;
      border-radius: 999px;
      font-size: 20px;
      font-weight: 900;
      padding: 12px 22px;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
    }
    .btn:active {
      transform: translateY(1px);
    }
    .swipe-cue {
      align-self: end;
      text-align: center;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .6px;
      color: #2f5f39;
      animation: cue 1s infinite ease-in-out;
    }
    @keyframes cue {
      0%, 100% { transform: translateY(0); opacity: .75; }
      50% { transform: translateY(-7px); opacity: 1; }
    }
    .toast {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      background: #1f9d45;
      border: 2px solid #0b6829;
      border-radius: 10px;
      font-weight: 900;
      padding: 8px 12px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
      animation: toastIn .7s ease forwards;
      pointer-events: none;
    }
    @keyframes toastIn {
      0% { opacity: 0; transform: translate(-50%, 8px); }
      20% { opacity: 1; transform: translate(-50%, 0); }
      80% { opacity: 1; transform: translate(-50%, -2px); }
      100% { opacity: 0; transform: translate(-50%, -10px); }
    }
    .confetti-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .confetti {
      position: absolute;
      width: 8px;
      height: 12px;
      border-radius: 2px;
      animation: pop .7s ease-out forwards;
    }
    @keyframes pop {
      from { opacity: 1; transform: translate(var(--x), var(--y)) rotate(0deg); }
      to { opacity: 0; transform: translate(calc(var(--x) + var(--dx)), calc(var(--y) + var(--dy))) rotate(360deg); }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hud">
      <div class="pill">Time: <span id="timer">90</span>s</div>
      <div class="pill">Score: <span id="score">0</span></div>
    </section>
    <div class="status" id="status">Tap to begin</div>
    <section class="card-wrap">
      <div id="card" class="card"></div>
      <div id="feedback"></div>
      <div id="confetti" class="confetti-layer"></div>
    </section>
  </main>
  <script src="./framework-core.js"></script>
  <script src="./minigame-burger.js"></script>
  <script src="./minigame-lightbulb.js"></script>
  <script src="./minigame-pipe.js"></script>
  <script src="./minigame-vanishing.js"></script>
  <script src="./minigame-plant.js"></script>
  <script src="./minigame-cooking.js"></script>
  <script src="./minigame-dinosaur.js"></script>
  <script src="./minigames.js"></script>
  <script src="./app.js"></script>
</body>
</html>
