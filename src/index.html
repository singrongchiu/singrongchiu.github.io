<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Farm Flick Framework</title>
  <style>
    :root {
      --bg1: #f6ecd2;
      --bg2: #d7efc1;
      --ink: #1c2a23;
      --accent: #2f8f46;
      --card: #fff7e6;
      --card-line: #6f7f56;
      --danger: #e95f5f;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 20% 0%, #fff8df 0%, var(--bg1) 40%, var(--bg2) 100%);
    }
    .app {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 12px 12px 16px;
      gap: 8px;
    }
    .hud {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .pill {
      border: 2px solid var(--card-line);
      background: #fffef5;
      border-radius: 14px;
      padding: 10px 12px;
      text-align: center;
      font-weight: 700;
      font-size: 18px;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.12);
    }
    .status {
      text-align: center;
      font-size: 14px;
      min-height: 18px;
      font-weight: 700;
    }
    .card-wrap {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 0;
    }
    .card {
      width: min(92vw, 500px);
      height: min(68vh, 540px);
      min-height: 360px;
      border: 3px solid var(--card-line);
      background: linear-gradient(#fffaf0, var(--card));
      border-radius: 20px;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.14);
      padding: 16px 14px 14px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      user-select: none;
    }
    .card.enter {
      animation: cardIn .2s ease-out;
    }
    @keyframes cardIn {
      from { transform: translateY(12px); opacity: .7; }
      to { transform: translateY(0); opacity: 1; }
    }
    .card-head {
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .2px;
    }
    .card-body {
      border: 2px dashed #93a477;
      border-radius: 14px;
      background: #fdf8e7;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 14px;
    }
    .placeholder-icon {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 6px;
      animation: bob 1s ease-in-out infinite alternate;
    }
    @keyframes bob {
      from { transform: translateY(0); }
      to { transform: translateY(-7px); }
    }
    .hint {
      font-size: 15px;
      line-height: 1.3;
      font-weight: 700;
      max-width: 22ch;
    }
    .chip {
      margin-top: 8px;
      font-size: 12px;
      padding: 5px 8px;
      border-radius: 999px;
      border: 1px solid #64824f;
      background: #ecf6dd;
      display: inline-block;
    }
    .burger-game {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto auto;
      align-items: end;
      justify-items: center;
      gap: 10px;
      cursor: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2742%27 height=%2742%27 viewBox=%270 0 28 28%27%3E%3Crect x=%272%27 y=%279%27 width=%2710%27 height=%277%27 rx=%271.5%27 fill=%27%23e6edf3%27 stroke=%27%234d5964%27 stroke-width=%271.5%27/%3E%3Cpath d=%27M12 12h13%27 stroke=%27%237b4e28%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3Cpath d=%27M5 10v5M8 10v5%27 stroke=%27%234d5964%27 stroke-width=%271%27/%3E%3C/svg%3E") 6 20, pointer;
    }
    .grill-scene {
      width: min(304px, 95%);
      height: 100%;
      max-height: 220px;
      border: 3px solid #5a5d63;
      border-radius: 16px;
      background: linear-gradient(#7f838a, #61666d);
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      justify-items: center;
      padding: 10px 8px;
      gap: 8px;
      overflow: hidden;
      cursor: inherit;
    }
    .grill-surface {
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.28) 0 5px,
          rgba(255, 255, 255, 0.06) 5px 12px
      );
      pointer-events: none;
    }
    .burger-smoke-layer {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      overflow: hidden;
    }
    .burger-smoke {
      position: absolute;
      width: 14px;
      height: 14px;
      margin-left: -7px;
      margin-top: -7px;
      border-radius: 50%;
      background: rgba(241, 241, 241, 0.78);
      box-shadow:
        0 0 0 2px rgba(214, 214, 214, 0.3) inset,
        0 0 8px rgba(214, 214, 214, 0.3);
      animation: grillSmoke .72s ease-out forwards;
    }
    @keyframes grillSmoke {
      from { opacity: .78; transform: translate(0, 0) scale(var(--ss)); }
      to { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(calc(var(--ss) + .55)); }
    }
    .patty-slot {
      position: relative;
      width: min(84px, 100%);
      aspect-ratio: 1 / 1;
      border: 0;
      background: none;
      border-radius: 50%;
      padding: 0;
      touch-action: none;
      z-index: 2;
      cursor: inherit;
    }
    .patty-face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid #493126;
      background: radial-gradient(circle at 35% 28%, #cf8a72 0 30%, #af6148 58%, #813f31 100%);
      box-shadow: inset -6px -8px 0 rgba(0, 0, 0, 0.22);
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }
    .patty-mark {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 46%;
      height: 46%;
      margin-left: -23%;
      margin-top: -23%;
      border-radius: 50%;
      border: 3px solid rgba(76, 42, 31, 0.65);
      transform: scale(.85);
      transition: border-color .16s ease;
    }
    .patty-slot.is-flipped .patty-face {
      border-color: #3a281f;
      background: radial-gradient(circle at 35% 26%, #8a5941 0 28%, #694130 58%, #4e3024 100%);
      transform: rotateY(180deg);
    }
    .patty-slot.is-flipped .patty-mark {
      border-color: rgba(36, 18, 12, 0.62);
    }
    .burger-chip {
      margin-top: 0;
    }
    .bulb-game {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto auto;
      align-items: end;
      justify-items: center;
      gap: 8px;
    }
    .lamp-scene {
      --lamp-glow: 0;
      --lamp-glow-size: .88;
      position: relative;
      width: min(280px, 92%);
      height: 220px;
    }
    .lamp-glow {
      position: absolute;
      left: 50%;
      top: 40%;
      width: 176px;
      height: 176px;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(var(--lamp-glow-size));
      background: radial-gradient(
        circle,
        rgba(255, 255, 212, 1) 0%,
        rgba(255, 246, 168, 0.92) 40%,
        rgba(255, 233, 114, 0.46) 66%,
        rgba(255, 237, 132, 0) 100%
      );
      opacity: calc(0.02 + var(--lamp-glow) * 0.98);
      box-shadow:
        0 0 calc(10px + var(--lamp-glow) * 42px) rgba(255, 238, 120, 0.88),
        0 0 calc(18px + var(--lamp-glow) * 58px) rgba(255, 213, 88, 0.5);
      transition: opacity .14s linear, transform .14s ease-out, box-shadow .14s linear;
      pointer-events: none;
    }
    .lamp-stem {
      position: absolute;
      left: 50%;
      top: 24px;
      width: 16px;
      height: 84px;
      margin-left: -8px;
      background: linear-gradient(#557a50, #385739);
      border-radius: 9px;
      border: 2px solid #2f4d30;
    }
    .lamp-socket {
      position: absolute;
      left: 50%;
      top: 102px;
      width: 140px;
      height: 78px;
      margin-left: -70px;
      border-radius: 44px 44px 18px 18px;
      border: 3px solid #486744;
      background: linear-gradient(#a5c98f, #7ba56b);
      box-shadow: inset 0 -8px 0 rgba(0, 0, 0, 0.1);
    }
    .bulb-hit {
      position: absolute;
      left: 50%;
      top: 68px;
      width: 94px;
      height: 132px;
      margin-left: -47px;
      border: 0;
      padding: 0;
      background: none;
      touch-action: none;
      cursor: pointer;
    }
    .bulb-glass {
      position: absolute;
      left: 50%;
      top: 0;
      width: 84px;
      height: 98px;
      margin-left: -42px;
      border-radius: 52% 52% 46% 46%;
      border: 3px solid #607d45;
      background: linear-gradient(#fffbe2, #f4f0d2);
      box-shadow: inset -10px -12px 0 rgba(255, 222, 101, 0.25);
    }
    .bulb-base {
      position: absolute;
      left: 50%;
      top: 88px;
      width: 40px;
      height: 40px;
      margin-left: -20px;
      border-radius: 8px;
      border: 3px solid #536b47;
      background: repeating-linear-gradient(
        to bottom,
        #ddded2 0 5px,
        #bec0b6 5px 10px
      );
    }
    .bulb-swipe-hint {
      font-size: 22px;
      font-weight: 900;
      color: #2a6139;
      letter-spacing: 2px;
      animation: bulbHint 1s ease-in-out infinite;
      user-select: none;
    }
    @keyframes bulbHint {
      0%, 100% { transform: translateX(-12px); opacity: .55; }
      50% { transform: translateX(12px); opacity: 1; }
    }
    .bulb-chip {
      margin-top: 0;
    }
    .plant-game {
      width: 100%;
      height: 100%;
      position: relative;
      display: grid;
      grid-template-rows: 1fr auto auto;
      gap: 10px;
      align-items: end;
      justify-items: center;
    }
    .garden-bed {
      width: min(300px, 95%);
      height: 100%;
      max-height: 220px;
      position: relative;
      z-index: 1;
      border: 3px solid #6a8655;
      border-radius: 16px;
      background:
        linear-gradient(to top, #9a6f42 0 30%, #d7bf95 30% 42%, #b7d79b 42% 100%);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: end;
      gap: 6px;
      padding: 10px 8px 8px;
    }
    .plant-slot {
      position: relative;
      border: 0;
      background: none;
      height: 100%;
      min-height: 140px;
      padding: 0;
      touch-action: none;
    }
    .plant-pot {
      position: absolute;
      left: 50%;
      bottom: 6px;
      width: 52px;
      height: 38px;
      margin-left: -26px;
      border-radius: 8px 8px 14px 14px;
      border: 3px solid #644427;
      background: linear-gradient(#d08f4f, #a86435);
      box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.15);
    }
    .plant-stem {
      position: absolute;
      left: 50%;
      bottom: 42px;
      width: 8px;
      height: 46px;
      margin-left: -4px;
      border-radius: 999px;
      background: #4f7a34;
      transition: transform .15s ease, background .15s ease;
    }
    .plant-leaf {
      position: absolute;
      bottom: 72px;
      width: 30px;
      height: 16px;
      border: 3px solid #44692f;
      background: #78b64d;
      border-radius: 20px 20px 20px 4px;
      transform-origin: center;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }
    .leaf-a {
      left: 50%;
      margin-left: -30px;
      transform: rotate(-24deg);
    }
    .leaf-b {
      left: 50%;
      margin-left: 0;
      transform: scaleX(-1) rotate(-24deg);
    }
    .plant-state {
      position: absolute;
      left: 50%;
      top: 8px;
      margin-left: -14px;
      width: 28px;
      height: 22px;
      border-radius: 999px;
      border: 2px solid #587348;
      background: #edf5d8;
      font-size: 10px;
      font-weight: 900;
      display: grid;
      place-items: center;
      color: #2a4b2f;
      letter-spacing: .2px;
    }
    .plant-slot.is-dry .plant-stem {
      background: #647a4f;
      transform: skewX(-5deg);
    }
    .plant-slot.is-dry .plant-leaf {
      background: #99ad7f;
      border-color: #6d8059;
      transform: rotate(-38deg) scale(.96);
    }
    .plant-slot.is-dry .leaf-b {
      transform: scaleX(-1) rotate(-38deg) scale(.96);
    }
    .plant-slot.is-dry .plant-state {
      background: #f8e8d0;
      border-color: #8e6b3a;
      color: #8b4a2f;
    }
    .can-lane {
      width: min(300px, 95%);
      height: 92px;
      border-radius: 14px;
      border: 2px dashed #8aa270;
      background: #eff8de;
      position: relative;
      z-index: 2;
      overflow: visible;
    }
    .watering-can {
      position: absolute;
      left: 12px;
      top: 24px;
      z-index: 3;
      width: 96px;
      height: 58px;
      border: 0;
      background: none;
      padding: 0;
      touch-action: none;
      cursor: grab;
    }
    .watering-can:active {
      cursor: grabbing;
    }
    .can-body {
      position: absolute;
      left: 8px;
      top: 14px;
      width: 52px;
      height: 34px;
      border-radius: 8px;
      border: 3px solid #335f84;
      background: linear-gradient(#8fd1ff, #5ba8df);
    }
    .can-top {
      position: absolute;
      left: 16px;
      top: 8px;
      width: 34px;
      height: 10px;
      border-radius: 999px;
      border: 3px solid #335f84;
      background: #c6ecff;
    }
    .can-spout {
      position: absolute;
      right: 9px;
      top: 19px;
      width: 34px;
      height: 12px;
      border-radius: 0 999px 999px 0;
      border: 3px solid #335f84;
      border-left-width: 0;
      background: #74b9ea;
    }
    .can-handle {
      position: absolute;
      left: 2px;
      top: 12px;
      width: 20px;
      height: 30px;
      border-radius: 999px 0 0 999px;
      border: 3px solid #335f84;
      border-right-width: 0;
      background: none;
    }
    .plant-chip {
      margin-top: 0;
    }
    .btn {
      border: 2px solid #2f5f39;
      background: linear-gradient(#60b86c, #3b944d);
      color: #fff;
      border-radius: 999px;
      font-size: 20px;
      font-weight: 900;
      padding: 12px 22px;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
    }
    .btn:active {
      transform: translateY(1px);
    }
    .swipe-cue {
      align-self: end;
      text-align: center;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .6px;
      color: #2f5f39;
      animation: cue 1s infinite ease-in-out;
    }
    @keyframes cue {
      0%, 100% { transform: translateY(0); opacity: .75; }
      50% { transform: translateY(-7px); opacity: 1; }
    }
    .toast {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      background: #1f9d45;
      border: 2px solid #0b6829;
      border-radius: 10px;
      font-weight: 900;
      padding: 8px 12px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
      animation: toastIn .7s ease forwards;
      pointer-events: none;
    }
    @keyframes toastIn {
      0% { opacity: 0; transform: translate(-50%, 8px); }
      20% { opacity: 1; transform: translate(-50%, 0); }
      80% { opacity: 1; transform: translate(-50%, -2px); }
      100% { opacity: 0; transform: translate(-50%, -10px); }
    }
    .confetti-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .confetti {
      position: absolute;
      width: 8px;
      height: 12px;
      border-radius: 2px;
      animation: pop .7s ease-out forwards;
    }
    @keyframes pop {
      from { opacity: 1; transform: translate(var(--x), var(--y)) rotate(0deg); }
      to { opacity: 0; transform: translate(calc(var(--x) + var(--dx)), calc(var(--y) + var(--dy))) rotate(360deg); }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hud">
      <div class="pill">Time: <span id="timer">90</span>s</div>
      <div class="pill">Score: <span id="score">0</span></div>
    </section>
    <div class="status" id="status">Tap to begin</div>
    <section class="card-wrap">
      <div id="card" class="card"></div>
      <div id="feedback"></div>
      <div id="confetti" class="confetti-layer"></div>
    </section>
    <div class="swipe-cue">^^^ SWIPE UP TO SKIP ^^^</div>
  </main>
  <script src="./framework-core.js"></script>
  <script src="./minigame-burger.js"></script>
  <script src="./minigame-lightbulb.js"></script>
  <script src="./minigame-plant.js"></script>
  <script src="./minigames.js"></script>
  <script src="./app.js"></script>
</body>
</html>
